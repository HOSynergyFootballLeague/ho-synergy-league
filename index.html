<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HO Synergy League 2026</title>
<style>
:root{--bg:#eef1f6;--fg:#12203a;--card:#fff;--mut:#64708a;--line:#dde3ee;--hd:#12203a;--pur:#e8defa;--g:#1a7f4b}
@media(prefers-color-scheme:dark){:root{--bg:#0c1220;--fg:#e6ebf5;--card:#161f33;--mut:#93a0ba;--line:#26324b;--hd:#0a0f1c;--pur:#3b2a66;--g:#3ecf8e}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:auto;padding:12px}
.bn{width:100%;display:block;border-radius:16px}
.ban{background:linear-gradient(135deg,#0d1b4d,#3a1f8a);color:#fff;border-radius:16px;padding:20px 12px;text-align:center;font-weight:800;font-size:22px;letter-spacing:.5px}
.ban small{display:block;font-weight:500;font-size:13px;opacity:.8;margin-top:4px}
.tabs{display:flex;border-bottom:2px solid var(--line);margin:12px 0}
.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 2px;font:600 15px system-ui,sans-serif;color:var(--mut);cursor:pointer}
.tabs .on{color:var(--g);border-color:var(--g)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
h2{font-size:16px;margin:14px 0 6px}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--hd);color:#fff;padding:8px 6px;text-align:center;white-space:nowrap}
td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);background:var(--card)}
.l{text-align:left}
tr.lead td,tr.top td{background:var(--pur);font-weight:800}
.lg{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:700;object-fit:cover;vertical-align:middle;flex:none}
.mut{color:var(--mut)}.sm{font-size:13px}
.mt{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:600}
.tn{display:flex;align-items:center;gap:6px;flex:1}.tn.r{justify-content:flex-end;text-align:right}
.sco{font-size:20px;padding:0 6px}
button,select,input,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 8px;max-width:100%}
input[type=number]{width:56px}
textarea{width:100%;box-sizing:border-box}
.b{background:var(--g);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.b.s{background:none;color:var(--g);border:1px solid var(--g)}
.b.x{background:#c0392b}
.ed{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tc{text-align:center;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 6px;font-weight:700}
.rh{background:var(--hd);color:#fff;border-radius:8px;padding:6px 10px;font-weight:700;margin-top:14px}
.note{background:var(--pur);border-radius:10px;padding:8px 10px;font-size:13px}
.st{font-size:13px}.st td,.st th{padding:7px 4px}.st td.l{white-space:nowrap;min-width:140px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.cols>div:last-child{text-align:right}
.me td{font-weight:800}
</style></head><body>

const logo=(i,z=28)=>{const o=img(S.tav[i]?.img);return `<img class="lg" alt="" style="width:${z}px;height:${z}px;${o?"":"border-radius:0;object-fit:contain;"}" src="${o?S.tav[i].img:LOGO[i]}">`};

const ok=m=>{const r=R(m.id);return r&&typeof r.h==="number"&&typeof r.a==="number"};

function table(){const t=T.map((n,i)=>({i,p:0,w:0,d:0,l:0,gf:0,ga:0,cd:0}));
 M.forEach(m=>{const r=R(m.id);if(r)(r.ev||[]).forEach(x=>{if(x.t==="y")t[x.tm].cd+=1;else if(x.t==="r")t[x.tm].cd+=3});if(!ok(m))return;const H=t[m.h],A=t[m.a];H.p++;A.p++;H.gf+=r.h;H.ga+=r.a;A.gf+=r.a;A.ga+=r.h;if(r.h>r.a){H.w++;A.l++}else if(r.h<r.a){A.w++;H.l++}else{H.d++;A.d++}});
 t.forEach(x=>{x.gd=x.gf-x.ga;x.pt=x.w*3+x.d});
 const h2=(i,j)=>{const m=M.find(m=>ok(m)&&((m.h===i&&m.a===j)||(m.h===j&&m.a===i)));if(!m)return 0;const r=R(m.id),d=r.h-r.a;if(!d)return 0;return (m.h===i)===(d>0)?-1:1};
 return t.sort((a,b)=>b.pt-a.pt||b.gd-a.gd||h2(a.i,b.i)||a.cd-b.cd||b.gf-a.gf)}
function evs(){const sc={},cd={};M.forEach(m=>(R(m.id)?.ev||[]).forEach(x=>{const k=x.n+"|"+x.tm;if(x.t==="g"){sc[k]=sc[k]||{n:x.n,tm:x.tm,c:0};sc[k].c++}else if(x.t==="y"||x.t==="r"){cd[k]=cd[k]||{n:x.n,tm:x.tm,y:0,r:0};x.t==="y"?cd[k].y++:cd[k].r++}}));return{sc:Object.values(sc).sort((a,b)=>b.c-a.c),cd:Object.values(cd).sort((a,b)=>b.r-a.r||b.y-a.y)}}

function home(){
 const ns=Object.entries(S.news).sort((a,b)=>b[1].ts-a[1].ts);
 let h=`<div class="card"><b>📢 Thông báo</b>`+(ns.length?ns.map(([k,n])=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line)"><div style="flex:1"><span class="mut sm">${fd(new Date(n.ts))}</span><br>${e(n.t).replace(/\n/g,"<br>")}</div>${S.admin?`<button class="b x" data-a="delnews" data-k="${e(k)}">✕</button>`:""}</div>`).join(""):`<div class="mut sm">Chưa có thông báo.</div>`);
 if(S.admin)h+=`<div class="ed"><textarea id="nt" rows="2" placeholder="Nội dung thông báo (admin)"></textarea><button class="b" data-a="addnews">Đăng thông báo</button></div>`;
 h+=`</div><h2>Bảng xếp hạng</h2><div class="sc"><table class="st"><tr><th>#</th><th class="l">Đội</th><th>Trận</th><th>T</th><th>H</th><th>B</th><th>BT</th><th>BB</th><th>HS</th><th>Đ</th></tr>`;
 table().forEach((x,k)=>h+=`<tr class="${k?"":"lead"}"><td>${k+1}</td><td class="l">${logo(x.i,20)} ${e(T[x.i])}</td><td>${x.p}</td><td>${x.w}</td><td>${x.d}</td><td>${x.l}</td><td>${x.gf}</td><td>${x.ga}</td><td>${x.gd>0?"+":""}${x.gd}</td><td><b>${x.pt}</b></td></tr>`);
 h+=`</table></div><div class="mut sm">Thắng +3, hòa +1, thua 0. Xếp theo điểm, hiệu số; bằng nhau xét đối đầu, rồi ít thẻ phạt hơn (vàng 1, đỏ 3), rồi số bàn thắng. T: thắng, H: hòa, B: bại, BT/BB: bàn thắng/bàn bại, HS: hiệu số, Đ: điểm.</div>`;
 const v=evs(),mx=v.sc[0]?.c;
 h+=`<h2>⚽ Vua phá lưới</h2>`+(v.sc.length?`<div class="sc"><table><tr><th>#</th><th class="l">Cầu thủ</th><th class="l">Đội</th><th>Bàn</th></tr>${v.sc.map((x,k)=>`<tr class="${x.c===mx?"top":""}"><td>${k+1}</td><td class="l">${e(x.n)}</td><td class="l">${e(T[x.tm])}</td><td>${x.c}</td></tr>`).join("")}</table></div>`:`<div class="mut sm">Chưa có dữ liệu.</div>`);
 h+=`<h2>Thẻ phạt</h2>`+(v.cd.length?`<div class="sc"><table><tr><th class="l">Cầu thủ</th><th class="l">Đội</th><th>🟨</th><th>🟥</th></tr>${v.cd.map(x=>`<tr><td class="l">${e(x.n)}</td><td class="l">${e(T[x.tm])}</td><td>${x.y}</td><td>${x.r}</td></tr>`).join("")}</table></div>`:`<div class="mut sm">Chưa có thẻ phạt.</div>`);
 h+=valBoard();
 h+=predBoard();
 return h}

const fv=n=>n.toFixed(1).replace(".",",");
const PR_RIGHT=1,PR_EXACT=3;
function pscore(p){const r=R(p.match_id);if(!r||typeof r.h!=="number")return 0;const out=r.h>r.a?"h":r.h<r.a?"a":"d",has=p.pred_home!=null&&p.pred_away!=null,w=p.winner||(has?(p.pred_home>p.pred_away?"h":p.pred_home<p.pred_away?"a":"d"):null);if(has&&p.pred_home===r.h&&p.pred_away===r.a)return PR_EXACT;return w===out?PR_RIGHT:0}
const pbeer=uid=>S.fp.filter(p=>p.user_id===uid).reduce((a,p)=>a+pscore(p),0);
function predBoard(){const m={};S.fp.forEach(p=>{const x=m[p.user_id]=m[p.user_id]||{n:p.name,b:0,c:0,t:0};x.t++;const s=pscore(p);if(s){x.b+=s;x.c++}});
 const L=Object.entries(m).sort((a,b)=>b[1].b-a[1].b||b[1].c-a[1].c).slice(0,10);
 return `<h2>🔮 Thưởng dự đoán</h2>`+(L.length?`<div class="sc"><table><tr><th>#</th><th class="l">Cầu thủ</th><th>Đúng</th><th>🍺</th></tr>${L.map(([k,x],i)=>`<tr${k===S.uid?' class="me"':""}><td>${i+1}</td><td class="l"><a href="#p-${e(k)}" style="color:inherit;font-weight:600">${e(S.players[k]?.name||x.n)}</a></td><td>${x.c}/${x.t}</td><td>${fv(x.b)}</td></tr>`).join("")}</table></div><div class="mut sm">Dự đoán đúng kết quả +${PR_RIGHT}🍺, đúng tỷ số +${PR_EXACT}🍺. Thưởng này không cộng vào giá trị chuyển nhượng.</div>`:`<div class="mut sm">Chưa có kết quả dự đoán.</div>`)}
function val(uid){const p=S.players[uid];let b=5,l=5;if(!p)return{b,l};
 const mine=x=>x.pid?x.pid===uid:(p.team!=null&&x.tm===p.team&&String(x.n).trim().toLowerCase()===String(p.name).trim().toLowerCase());
 M.forEach(m=>{if(!ok(m))return;const r=R(m.id),ev=(r.ev||[]).filter(mine);
  const inM=p.team===m.h||p.team===m.a;
  if(!((inM&&(m.r===1||(S.att[m.id]||[]).includes(uid)))||ev.length))return;
  b+=.5;l+=.5;
  const t=inM?p.team:ev[0]?.tm;
  if(t===m.h||t===m.a){const gf=t===m.h?r.h:r.a,ga=t===m.h?r.a:r.h;if(gf>ga){b+=1;l+=1}else if(gf<ga)b-=1;if(ga===0&&p.position==="GK"){b+=.5;l+=.5}}
  ev.forEach(x=>{if(x.t==="g"){b+=.5;l+=.5}else if(x.t==="y")b-=.5;else if(x.t==="r")b-=1});
 });
 return{b:Math.max(0,b),l:Math.max(0,l)}}
const vt=u=>{const v=val(u);return `${fv(v.b)}🍺 ${fv(v.l)}🥜`};
function valBoard(){const all=Object.entries(S.players).filter(([k,p])=>p.team!=null).map(([k,p])=>({k,p,v:val(k)})).sort((a,b)=>(b.v.b+b.v.l)-(a.v.b+a.v.l)||b.v.b-a.v.b);
 const row=(x,i)=>`<tr${x.k===S.uid?' class="me"':""}><td>${i+1}</td><td class="l"><a href="#p-${e(x.k)}" style="color:inherit;font-weight:600">${e(x.p.name)}</a></td><td class="l">${e(T[x.p.team])}</td><td>${fv(x.v.b)}</td><td>${fv(x.v.l)}</td></tr>`;
 const mi=all.findIndex(x=>x.k===S.uid);
 let body=(S.vall?all:all.slice(0,3)).map(row).join("");
 if(!S.vall&&mi>=3)body+=`<tr><td colspan="5" class="mut">⋯</td></tr>`+row(all[mi],mi);
 return `<h2>💰 Giá trị chuyển nhượng</h2>`+(all.length?`<div class="sc"><table><tr><th>#</th><th class="l">Cầu thủ</th><th class="l">Đội</th><th>🍺</th><th>🥜</th></tr>${body}</table></div>${all.length>3?`<div class="row" style="justify-content:center"><button class="b s" data-a="vall">${S.vall?"Thu gọn":"Xem thêm ("+(all.length-3)+" cầu thủ)"}</button></div>`:""}<div class="mut sm">Khởi điểm 5🍺 5🥜. Tham gia trận +0,5 mỗi loại (vòng 1 tính mặc định cho cầu thủ đã vào đội, từ vòng 2 phải đăng ký tham gia); đội thắng +1 mỗi loại, đội thua −1🍺; ghi bàn +0,5 mỗi loại; thủ môn (GK) giữ sạch lưới +0,5 mỗi loại; thẻ vàng −0,5🍺, thẻ đỏ −1🍺; phản lưới không tính. Thấp nhất là 0.</div>`:`<div class="mut sm">Chưa có cầu thủ đăng ký đội.</div>`)}
function evCols(r,m,del){const ic={g:"⚽",og:"⚽",y:"🟨",r:"🟥"};const col=tm=>r.ev.map((x,i)=>x.tm===tm?`<div class="sm">${ic[x.t]} ${e(x.n)}${x.t==="og"?` <span class="mut">(phản lưới)</span>`:""}${del?` <button class="b x" data-a="dev" data-i="${i}">✕</button>`:""}</div>`:"").join("");return `<div class="cols"><div><b class="sm">${e(T[m.h])}</b>${col(m.h)}</div><div><b class="sm">${e(T[m.a])}</b>${col(m.a)}</div></div>`}

  if(pl&&p&&p.w){const w=r.h>r.a?"h":r.h<r.a?"a":"d";h+=`<div class="sm mut">Bạn dự đoán ${p.w===w?"đúng ✅":"chưa đúng ❌"}${p.h!==""?` (${e(p.h)}-${e(p.a)})`:""}</div>`}
  if(S.admin){
   if(S.edit===m.id){const d=S.draft,ro=Object.values(S.players).filter(x=>x.team===m.h||x.team===m.a).map(x=>`<option value="${e(x.name)}">`).join("");
    h+=`<div class="ed"><div class="row"><b>Trọng tài:</b><input id="er" value="${e(d.ref??m.ref)}"></div><div class="row"><b>Kết quả:</b><input type="number" min="0" id="eh" value="${d.h}"> - <input type="number" min="0" id="ea" value="${d.a}"></div>${d.ev.length?evCols(d,m,true):""}<div class="row"><select id="et"><option value="g">⚽ Bàn thắng</option><option value="og">⚽ Phản lưới</option><option value="y">🟨 Thẻ vàng</option><option value="r">🟥 Thẻ đỏ</option></select><select id="ep"><option value="">— Chọn cầu thủ —</option>${[m.h,m.a].map(tm=>`<optgroup label="${e(T[tm])}">${Object.entries(S.players).filter(([k,x])=>x.team===tm).map(([k,x])=>`<option value="${e(k)}" data-t="${tm}">${e(x.name)} (#${e(x.num)})</option>`).join("")}</optgroup>`).join("")}</select><button class="b s" data-a="aev">Thêm</button></div><div class="row sm mut">Không có trong danh sách?<select id="etm"><option value="${m.h}">${e(T[m.h])}</option><option value="${m.a}">${e(T[m.a])}</option></select><input id="en" placeholder="Nhập tên"></div><div class="row"><button class="b" data-a="sres">Lưu kết quả</button><button class="b s" data-a="unedit">Đóng</button></div></div>`}
   else h+=`<div class="row"><button class="b s" data-a="edit" data-m="${m.id}">Nhập kết quả</button></div>`}

 return h}

async function load(){
 try{

  S.res={};(m.data||[]).forEach(x=>{if(x.hg!=null&&x.ag!=null)S.res[x.id]={h:x.hg,a:x.ag,ev:[]}});
  (ev.data||[]).forEach(x=>S.res[x.match_id]?.ev.push({t:x.type,tm:x.team,n:x.player,pid:x.player_id}));
  S.players={};(pf.data||[]).forEach(p=>S.players[p.id]={name:p.name,bd:p.bd,av:p.avatar,team:p.team,num:p.num,cancel:p.cancel,admin:p.is_admin,height:p.height,weight:p.weight,position:p.pos});
  S.news={};(nw.data||[]).forEach(n=>S.news[n.id]={t:n.content,ts:Date.parse(n.created_at)});
  S.tav={};(ta.data||[]).forEach(x=>S.tav[x.team]={img:x.img});
  S.cfg={main:{zalo:(st.data||[]).find(x=>x.key==="zalo")?.value||"",closed:(st.data||[]).find(x=>x.key==="pred_closed")?.value==="1"}};
  S.admin=!!S.players[S.uid]?.admin;
  S.fp=fp.data||[];
  S.att={};(at.data||[]).forEach(x=>(S.att[x.match_id]||=[]).push(x.user_id));
  S.pred={};
  if(S.uid){const pr=await sb.from("predictions").select("*").eq("user_id",S.uid);(pr.data||[]).forEach(x=>S.pred[x.match_id]={w:x.winner||"",h:x.pred_home??"",a:x.pred_away??""})}
  S.zl=false;if(S.uid){const zl=await sb.from("zalo_links").select("user_id").eq("user_id",S.uid);S.zl=!!(zl.data&&zl.data.length);if(S.zl)S.zcode=null}
  S.loaded=true;
 }catch(x){console.error(x)}
 draw();
}
const X=async p=>{const r=await p;if(r.error)throw r.error;return r};
const W=async fn=>{try{await fn();await load()}catch(x){alert(x.message||x)}};
const syncDraft=()=>{if(S.draft){S.draft.h=$("#eh")?.value===""?"":+$("#eh").value;S.draft.a=$("#ea")?.value===""?"":+$("#ea").value;S.draft.ref=$("#er")?.value??S.draft.ref}};
const shrink=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=c.height=96;const s=Math.min(i.width,i.height);c.getContext("2d").drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,96,96);res(c.toDataURL("image/jpeg",.8))};i.onerror=rej;i.src=r.result};r.readAsDataURL(f)});
function pend(){const ep=$("#ep");if(!ep)return null;const t=$("#et").value;if(ep.value){const o=ep.selectedOptions[0],p=S.players[ep.value];return{t,tm:+o.dataset.t,n:p?.name||o.text,pid:ep.value}}const n=$("#en").value.trim();return n?{t,tm:+$("#etm").value,n}:null}
const A={
 backp:()=>{location.hash=""},
 rmatt:d=>{if(confirm("Gỡ cầu thủ này khỏi danh sách tham gia?"))W(()=>X(sb.from("attendance").delete().eq("user_id",d.u).eq("match_id",d.m)))},
 vall:()=>{S.vall=!S.vall;draw(1)},
 zcode:()=>W(async()=>{const r=await X(sb.rpc("create_zalo_code"));S.zcode=r.data}),
 unlinkz:()=>{if(confirm("Hủy liên kết Zalo?"))W(async()=>{await X(sb.from("zalo_links").delete().eq("user_id",S.uid));S.zl=false})},
 attend:d=>W(()=>X(sb.from("attendance").insert({user_id:S.uid,match_id:d.m}))),
 unattend:d=>W(()=>X(sb.from("attendance").delete().eq("user_id",S.uid).eq("match_id",d.m))),
 savepred:d=>{const r=document.querySelector(`.pr[data-m="${d.m}"]`),[w,h,a]=r.querySelectorAll("select,input");
  if(!w.value&&h.value===""&&a.value==="")return alert("Chọn đội thắng hoặc nhập tỷ số.");
  if((h.value==="")!==(a.value===""))return alert("Nhập đủ tỷ số hai đội.");
  if(!confirm("Mỗi trận chỉ được dự đoán một lần và không sửa được. Xác nhận lưu?"))return;
  W(()=>X(sb.from("predictions").insert({user_id:S.uid,match_id:d.m,winner:w.value||null,pred_home:h.value===""?null:+h.value,pred_away:a.value===""?null:+a.value})))},
 togglepred:()=>W(()=>X(sb.from("settings").upsert({key:"pred_closed",value:S.cfg.main?.closed?"0":"1"}))),
 nozalo:()=>alert("Admin chưa cài link bot Zalo."),
 tab:d=>{S.tab=d.t;S.open=null;S.pv=null;if(location.hash)location.hash="";draw(1)},open:d=>{S.open=+d.i;draw(1)},back:()=>{S.open=null;draw(1)},
 login:()=>W(()=>X(sb.auth.signInWithPassword({email:$("#ae").value.trim(),password:$("#ap").value}))),
 signup:()=>W(async()=>{const r=await X(sb.auth.signUp({email:$("#ae").value.trim(),password:$("#ap").value,options:{data:{name:$("#an").value.trim()}}}));if(!r.data.session)alert("Đã đăng ký. Kiểm tra email để xác nhận rồi đăng nhập.")}),
 logout:()=>W(()=>X(sb.auth.signOut())),
 chpw:()=>{const p=$("#np").value;if(p.length<6)return alert("Mật khẩu tối thiểu 6 ký tự.");W(async()=>{await X(sb.auth.updateUser({password:p}));alert("Đã đổi mật khẩu.")})},
 reg:()=>{const n=$("#rn").value.trim(),k=parseInt($("#rk").value);if(!n||!(k>=0&&k<=99))return alert("Nhập tên và số áo (0–99).");W(()=>X(sb.rpc("register_team",{t:S.open,n:k,p_name:n})))},
 cancel:()=>W(()=>X(sb.rpc("request_cancel"))),
 approve:d=>W(()=>X(sb.rpc("approve_cancel",{uid:d.p}))),
 savep:()=>W(async()=>{await X(sb.from("profiles").update({name:$("#pn").value.trim()||"Cầu thủ",bd:$("#pb").value||null,height:$("#ph").value?+$("#ph").value:null,weight:$("#pw").value?+$("#pw").value:null,pos:$("#pp").value||null}).eq("id",S.uid));alert("Đã lưu hồ sơ.")}),
 addnews:()=>{const t=$("#nt").value.trim();if(t)W(()=>X(sb.from("news").insert({content:t})))},
 delnews:d=>W(()=>X(sb.from("news").delete().eq("id",d.k))),
 zalo:()=>W(()=>X(sb.from("settings").upsert({key:"zalo",value:$("#zl").value.trim()}))),
 edit:d=>{const r=R(d.m);S.edit=d.m;S.draft=r?JSON.parse(JSON.stringify(r)):{h:"",a:"",ev:[]};draw(1)},
 unedit:()=>{S.edit=null;S.draft=null;draw(1)},
 aev:()=>{syncDraft();const x=pend();if(!x)return alert("Chọn cầu thủ hoặc nhập tên.");S.draft.ev.push(x);draw(1)},
 dev:d=>{syncDraft();S.draft.ev.splice(+d.i,1);draw(1)},
 sres:()=>{syncDraft();const d=S.draft,id=S.edit;if(typeof d.h!=="number"||typeof d.a!=="number")return alert("Nhập tỷ số.");const px=pend();if(px)d.ev.push(px);W(async()=>{
 const r=await X(sb.from("matches").update({hg:d.h,ag:d.a}).eq("id",id).select());
 if(!r.data.length)throw new Error("Không lưu được: tài khoản chưa có quyền admin (xem lại bước 6).");
 await X(sb.from("events").delete().eq("match_id",id));
 if(d.ev.length)await X(sb.from("events").insert(d.ev.map(x=>({match_id:id,type:x.t,team:x.tm,player:x.n,player_id:x.pid||null}))));
 const rf=await sb.from("matches").update({referee:(d.ref??"").trim()||null}).eq("id",id);
 S.edit=null;S.draft=null;
 alert(rf.error?"Đã lưu kết quả, nhưng chưa lưu được trọng tài: cần chạy lệnh SQL thêm cột referee trong Supabase.":"Đã lưu kết quả.")})}
};
const C={
 rd:t=>{S.rd=t.value;draw(1)},tm:t=>{S.tm=t.value;draw(1)},
 av:async t=>{if(t.files[0])W(async()=>X(sb.from("profiles").update({avatar:await shrink(t.files[0])}).eq("id",S.uid)))},
 tav:async t=>{if(t.files[0])W(async()=>X(sb.from("team_avatars").upsert({team:+t.dataset.i,img:await shrink(t.files[0])})))}
};
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-a]");if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
document.addEventListener("change",ev=>{const t=ev.target,k=t.dataset.c;if(k&&C[k])C[k](t)});

function route(){const m=location.hash.match(/^#p-([0-9a-f-]{36})$/i);S.pv=m?m[1]:null;draw(1);scrollTo(0,0)}
addEventListener("hashchange",route);route();
sb.auth.onAuthStateChange((_,s)=>{const id=s?.user?.id||null;if(id!==S.uid||!S.loaded){S.uid=id;load()}});
sb.auth.getSession().then(({data})=>{S.uid=data.session?.user?.id||null;load()});
setInterval(()=>{if(!document.hidden)load()},30000);
</script></body></html>
